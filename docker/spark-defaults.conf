# ---- Shared storage: MinIO through S3A (lab credentials, change for any real deployment) ----
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  rmcadmin
spark.hadoop.fs.s3a.secret.key                  rmcadmin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.attempts.maximum            3
spark.hadoop.fs.s3a.connection.timeout          10000

# ---- Spark's built-in fault tolerance (kept at defaults-ish so baselines are fair) ----
spark.task.maxFailures                          4
spark.network.timeout                           60s
spark.executor.heartbeatInterval                10s
spark.sql.shuffle.partitions                    16
spark.sql.adaptive.enabled                      true

# ---- Observability ----
spark.ui.prometheus.enabled                     true
spark.executor.processTreeMetrics.enabled       true
spark.eventLog.enabled                          false
